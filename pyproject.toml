[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procureiq"
version = "0.1.0"
description = "Auditable investigation of HMRC disclosed payments"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "scipy>=1.17,<2", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "streamlit>=1.50,<2", "plotly>=6,<7", "XlsxWriter>=3.2,<4", "python-pptx>=1.0,<2", "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "openpyxl>=3.1,<4", "httpx>=0.27,<1"]

[project.scripts]
procureiq = "procureiq.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
